  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy

  booking-service-1:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    container_name: halvion-booking-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3002
      - DATABASE_BOOKING_URL=postgresql://postgres:admin@postgres:5432/BOOKING?schema=public
      - LOGGING_DATABASE_URL=postgresql://postgres:admin@postgres:5432/LOGGING?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    expose:
      - "3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking-service-2:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    container_name: halvion-booking-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3002
      - DATABASE_BOOKING_URL=postgresql://postgres:admin@postgres:5432/BOOKING?schema=public
      - LOGGING_DATABASE_URL=postgresql://postgres:admin@postgres:5432/LOGGING?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    ports:
      - "3005:3002"
    expose:
      - "3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: halvion-nginx
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - booking-service-1
      - booking-service-2


