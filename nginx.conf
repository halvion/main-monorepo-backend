events { worker_connections 1024; }

http {
    upstream booking_servers {
        # Round-robin load balancing across both Docker instances
        server booking-service-1:3002;
        server booking-service-2:3002;
    }

    server {
        listen 80;

        # Disable response buffering for low-latency concurrent testing
        proxy_buffering off;

        location / {
            proxy_pass http://booking_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
