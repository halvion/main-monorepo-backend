# Core Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: halvion
  labels:
    app: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: your-registry/halvion-core:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: DATABASE_URL
              value: 'postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/CORE?schema=public'
            - name: LOGGING_DATABASE_URL
              value: 'postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/LOGGING?schema=public'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: halvion-secrets
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: halvion-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: halvion-config
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: halvion
spec:
  selector:
    app: core-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
