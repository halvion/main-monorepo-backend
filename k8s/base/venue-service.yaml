# Venue Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-service
  namespace: halvion
  labels:
    app: venue-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: venue-service
  template:
    metadata:
      labels:
        app: venue-service
    spec:
      containers:
        - name: venue-service
          image: your-registry/halvion-venue:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: '3003'
            - name: DATABASE_URL
              value: 'postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/VENUE?schema=public'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: halvion-secrets
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: halvion-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: halvion-config
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
---
apiVersion: v1
kind: Service
metadata:
  name: venue-service
  namespace: halvion
spec:
  selector:
    app: venue-service
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP
