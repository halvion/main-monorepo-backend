# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: halvion-ingress
  namespace: halvion
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  tls:
    - hosts:
        - api.your-domain.com
      secretName: halvion-tls
  rules:
    - host: api.your-domain.com
      http:
        paths:
          # Core Service (Auth)
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 3001
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 3001

          # Booking Service
          - path: /bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 3002

          # Venue Service
          - path: /venues
            pathType: Prefix
            backend:
              service:
                name: venue-service
                port:
                  number: 3003

          # Payment Service
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3004
